[package]
name = "vibe-pet"
version = "1.2.1"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api 是 macOS 透明窗口的必需项，漏了窗口会是白底
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "time"] }
# 插件 RSS 解析（每日资讯）。成熟解析器，避免手写 CDATA/实体的坑。
rss = "2"
# 资讯条目 pubDate（RFC2822）解析与本地时区换算（每日资讯「仅当天」过滤）。
chrono = "0.4"
# 打开系统浏览器（资讯卡「阅读原文」跳转；window.open 在透明无框窗里会被拦截）。
tauri-plugin-opener = "2"
# 腾讯行情接口返回 GBK 编码（A 股中文名），需要解码。
encoding_rs = "0.8"

# 安全兜底：全局快捷键提供不依赖 UI 的强制退出通道；
# 单实例锁避免多开导致多层全屏透明窗叠加。
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

# 自动更新（F1）：minisign 验签 + GitHub Releases 分发。
# 私钥绝不入库，只在本机 ~/.vibe-pet/updater.key 或环境变量。
tauri-plugin-updater = "2"

# 仅 macOS：把窗口转成 nonactivating NSPanel，实现「置顶但不抢焦点」。
# 注意 objc2 必须与 tauri-nspanel 使用同一版本，否则 Message trait
# 跨大版本不兼容会导致编译失败（tauri-nspanel 2.1 用 objc2 0.6）。
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSWorkspace",
    "NSRunningApplication",
    "NSPasteboard",
    # 框选层（texttools/selection_panel.rs）
    "NSApplication",
    "NSAttributedString",
    "NSBezierPath",
    "NSColor",
    "NSEvent",
    "NSFont",
    "NSGraphics",
    "NSPanel",
    "NSResponder",
    "NSScreen",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", features = [
    "NSDate",
    "NSCalendar",
    "NSString",
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSValue",
] }
# 取词框选 OCR（texttools/capture.rs）：
# ScreenCaptureKit 单帧截图 + Vision 本地识别，全部 objc2 0.6 生态同版本。
dispatch2 = "0.3"
block2 = "0.6"
objc2-core-video = { version = "0.3", default-features = false, features = ["CVPixelBuffer"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["CMSampleBuffer", "objc2-core-video"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["CFCGTypes", "CFDictionary"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
    "std",
    "SCError",
    "SCShareableContent",
    "SCStream",
    "dispatch2",
    "block2",
    "libc",
    "objc2-core-media",
    "objc2-core-graphics",
    "objc2-core-foundation",
] }
objc2-vision = { version = "0.3", default-features = false, features = [
    "std",
    "VNRecognizeTextRequest",
    "VNRequest",
    "VNRequestHandler",
    "VNObservation",
    "objc2-core-video",
    "objc2-core-foundation",
] }
